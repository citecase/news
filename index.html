<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CiteCase | Legal News Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Applying Georgia globally as requested */
        :root {
            --bg-color: #ffffff;
            --legal-black: #000000;
            --accent-blue: #2563eb;
            --border-light: #f1f5f9;
            --main-font: Georgia, 'Times New Roman', Times, serif;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--main-font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--legal-black);
            -webkit-font-smoothing: antialiased;
        }

        /* Branding & Logo */
        .citecase-logo {
            display: flex;
            align-items: center;
            font-family: var(--main-font);
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .logo-cite {
            color: var(--legal-black);
            padding-right: 2px;
        }

        .logo-case {
            background: var(--legal-black);
            color: white;
            padding: 0 10px;
            margin-left: 4px;
            border-radius: 4px;
        }

        /* Layout */
        .app-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* News Items */
        .news-item {
            border-bottom: 1px solid var(--border-light);
            padding: 1.75rem 0;
            transition: opacity 0.2s ease;
        }

        .news-item:first-child {
            padding-top: 1rem;
        }

        .news-headline {
            font-family: var(--main-font);
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.5rem;
            display: block;
            transition: color 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .news-headline:hover {
            color: var(--accent-blue);
        }

        .source-tag {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            background: #f8fafc;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-light);
        }

        /* Filter & Search Bar */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-container {
            position: relative;
            flex-grow: 1;
            min-width: 200px;
        }

        .search-input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: var(--main-font);
            font-weight: 400;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: #cbd5e1;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.02);
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
        }

        .filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.75rem;
            font-family: var(--main-font);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .filter-menu {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.5rem;
            padding: 1.5rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            margin-top: -1rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .filter-menu.active {
            display: grid;
        }

        .source-chip {
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-size: 0.7rem;
            font-family: var(--main-font);
            font-weight: 700;
            text-transform: uppercase;
            text-align: left;
            border: 1px solid #f1f5f9;
            transition: all 0.2s ease;
        }

        .source-chip.active {
            background: black;
            color: white;
            border-color: black;
        }

        .nav-btn {
            background: var(--legal-black);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-family: var(--main-font);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        #news-feed-list {
            min-height: 400px;
        }

        .time-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .jump-today {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            text-decoration: underline;
        }

        .meta-text {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Search Highlight Indicator */
        .search-badge {
            background: #dcfce7;
            color: #166534;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            margin-right: 8px;
        }

        .feedback-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: #000;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: opacity 0.2s;
            text-decoration: none;
        }

        .feedback-link:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Professional Centered Header -->
    <header class="w-full px-8 py-8 flex flex-col items-center border-b border-slate-100 bg-white sticky top-0 z-50">
        <div class="citecase-logo">
            <span class="logo-cite">Cite</span><span class="logo-case">Case</span>
        </div>
        <p class="meta-text text-slate-400 mt-2" style="font-size: 10px; tracking: 0.4em;">Legal News Hub</p>
        
        <a href="https://tally.so/r/J9pD0d" target="_blank" class="feedback-link mt-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd" />
            </svg>
            Give Feedback
        </a>
    </header>

    <div class="app-container">
        
        <!-- Controls Bar -->
        <div class="controls-bar">
            <div class="search-container">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search archives (type title or source)...">
            </div>
            <button onclick="toggleFilter()" class="filter-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-.293.707l-2 2A1 1 0 018 17v-5.586L3.293 6.707A1 1 0 013 6V3z" clip-rule="evenodd" />
                </svg>
                Select Sources
            </button>
        </div>

        <!-- Hidden Filter Menu -->
        <div id="filter-container" class="filter-menu">
            <!-- Chips Injected -->
        </div>

        <!-- Navigation & Meta Info -->
        <div class="mb-4 flex flex-col gap-4">
            <div id="top-nav" class="flex justify-between items-center hidden border-b border-slate-50 pb-4">
                <button onclick="loadNextDay()" class="nav-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clip-rule="evenodd" />
                    </svg>
                    Newer Updates
                </button>
                <span onclick="jumpToToday()" class="jump-today">Back to Today</span>
            </div>
            
            <div class="meta-text text-slate-400 flex justify-between items-center px-1">
                <span id="date-label">Today's Feed</span>
                <span><span id="feed-stats" class="text-slate-900">0</span> Results Found</span>
            </div>
        </div>

        <!-- Feed List -->
        <main id="news-feed-list">
            <!-- Items Injected -->
        </main>

        <div id="empty-view" class="hidden py-20 text-center">
            <p class="meta-text text-slate-400 italic">No news found for your query or filters</p>
        </div>

        <div id="archive-nav" class="mt-8 flex flex-col items-center">
            <button onclick="loadPreviousDay()" class="nav-btn w-full justify-center py-4 text-xs">
                Archive: Previous Day
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </div>

    <footer class="mt-auto py-12 border-t border-slate-50 bg-white text-center">
        <p class="meta-text text-slate-300" style="tracking: 0.3em;">CiteCase Legal News Hub • Indian Standard Time</p>
    </footer>

    <script>
        const DATA_URL = "https://raw.githubusercontent.com/citecase/news/main/news.json";
        const newsFeedList = document.getElementById('news-feed-list');
        const emptyView = document.getElementById('empty-view');
        const filterContainer = document.getElementById('filter-container');
        const feedStats = document.getElementById('feed-stats');
        const searchInput = document.getElementById('search-input');
        const dateLabel = document.getElementById('date-label');
        const topNav = document.getElementById('top-nav');
        const archiveNav = document.getElementById('archive-nav');
        
        let newsData = [];
        let activeSources = new Set();
        let allSources = [];
        let dayOffset = 0;
        let searchQuery = '';

        // Base Context IST
        const FIXED_TODAY_IST = new Date("2026-01-27T00:00:00+05:30");

        async function initApp() {
            try {
                const response = await fetch(DATA_URL);
                const raw = await response.json();
                
                // Process and normalize to IST (+5:30)
                newsData = raw.map(item => ({
                    ...item,
                    timestamp: new Date(item.date.replace(' IST', '+05:30'))
                })).sort((a, b) => b.timestamp - a.timestamp);

                allSources = [...new Set(newsData.map(item => item.source))].sort();
                activeSources = new Set(allSources);

                // Initialize Search listener
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value.toLowerCase().trim();
                    refreshList();
                });

                renderFilters();
                refreshList();
            } catch (error) {
                newsFeedList.innerHTML = `<div class="py-20 text-center text-slate-300 font-bold uppercase tracking-widest text-xs italic">Connecting...</div>`;
            }
        }

        function toggleFilter() {
            filterContainer.classList.toggle('active');
        }

        function renderFilters() {
            filterContainer.innerHTML = '';
            allSources.forEach(source => {
                const btn = document.createElement('button');
                const isActive = activeSources.has(source);
                btn.className = `source-chip ${isActive ? 'active' : ''}`;
                btn.innerText = source;
                btn.onclick = () => {
                    if (activeSources.has(source)) {
                        if (activeSources.size > 1) activeSources.delete(source);
                    } else {
                        activeSources.add(source);
                    }
                    renderFilters();
                    refreshList();
                };
                filterContainer.appendChild(btn);
            });
        }

        function loadPreviousDay() {
            dayOffset++;
            refreshList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function loadNextDay() {
            if (dayOffset > 0) {
                dayOffset--;
                refreshList();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function jumpToToday() {
            dayOffset = 0;
            searchInput.value = '';
            searchQuery = '';
            refreshList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function refreshList() {
            newsFeedList.innerHTML = '';
            const isSearching = searchQuery.length > 0;
            
            const targetDate = new Date(FIXED_TODAY_IST);
            targetDate.setDate(targetDate.getDate() - dayOffset);
            
            const nextDay = new Date(targetDate);
            nextDay.setDate(nextDay.getDate() + 1);

            // Hide/Show Navigation based on search state
            if (isSearching) {
                topNav.classList.add('hidden');
                archiveNav.classList.add('hidden');
                dateLabel.innerText = "Results in All Archives";
            } else {
                archiveNav.classList.remove('hidden');
                if (dayOffset > 0) {
                    topNav.classList.remove('hidden');
                } else {
                    topNav.classList.add('hidden');
                }
                const options = { day: '2-digit', month: 'short', year: 'numeric' };
                const dateStr = targetDate.toLocaleDateString('en-IN', options);
                dateLabel.innerText = dayOffset === 0 ? "Today's Feed" : `${dateStr} Feed`;
            }

            const filteredData = newsData.filter(item => {
                const matchesSource = activeSources.has(item.source);
                const matchesSearch = item.title.toLowerCase().includes(searchQuery) || 
                                     item.source.toLowerCase().includes(searchQuery);

                if (isSearching) {
                    // Global search ignores dayOffset
                    return matchesSource && matchesSearch;
                } else {
                    // Standard daily view
                    const itemTime = item.timestamp.getTime();
                    const inDay = itemTime >= targetDate.getTime() && itemTime < nextDay.getTime();
                    return inDay && matchesSource;
                }
            });
            
            feedStats.innerText = filteredData.length;

            if (filteredData.length === 0) {
                emptyView.classList.remove('hidden');
            } else {
                emptyView.classList.add('hidden');
                filteredData.forEach(item => {
                    newsFeedList.appendChild(createNewsItem(item, isSearching));
                });
            }
        }

        function createNewsItem(item, isSearching) {
            const article = document.createElement('article');
            article.className = 'news-item';
            
            // Format IST time for the item
            const istOptions = { hour: '2-digit', minute: '2-digit', hour12: true };
            const timeStr = item.timestamp.toLocaleString('en-IN', istOptions);
            
            // If searching globally, add date to the meta-line
            const dateStr = isSearching ? item.timestamp.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + " • " : "";

            article.innerHTML = `
                <div class="flex items-center gap-2 mb-2">
                    ${isSearching ? '<span class="search-badge">ARCHIVE</span>' : ''}
                    <span class="source-tag">${item.source}</span>
                    <span class="time-label">${dateStr}${timeStr} IST</span>
                </div>
                <a href="${item.link}" target="_blank" class="news-headline">
                    ${item.title}
                </a>
            `;
            return article;
        }

        window.onload = initApp;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CiteCase | Legal News Hub</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CiteCase">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --legal-black: #000000;
            --accent-blue: #2563eb;
            --border-light: #f1f5f9;
            --main-font: Georgia, 'Times New Roman', Times, serif;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--main-font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--legal-black);
            -webkit-font-smoothing: antialiased;
            overflow-y: auto;
        }

        .citecase-logo {
            display: flex;
            align-items: center;
            font-family: var(--main-font);
            font-weight: 900;
            font-size: 2rem;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .logo-cite { color: var(--legal-black); padding-right: 2px; }
        .logo-case {
            background: var(--legal-black);
            color: white;
            padding: 0 8px;
            margin-left: 4px;
            border-radius: 4px;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 1.25rem;
        }

        .news-item {
            border-bottom: 1px solid var(--border-light);
            padding: 1.5rem 0;
            transition: opacity 0.2s ease;
        }

        .news-item:first-child { padding-top: 0.5rem; }

        .news-headline {
            font-family: var(--main-font);
            font-size: 1.45rem;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 0.5rem;
            display: block;
            transition: color 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        @media (min-width: 768px) {
            .news-headline { font-size: 1.75rem; }
            .app-container { padding: 2rem; }
        }

        .news-headline:hover { color: var(--accent-blue); }

        .source-tag {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            background: #f8fafc;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-light);
        }

        .source-caseciter { background: #000; color: #fff; border-color: #000; }

        .controls-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .search-container { position: relative; flex-grow: 1; }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.6rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: var(--main-font);
            outline: none;
        }

        .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none; }

        .settings-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #64748b;
        }

        .home-filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 1rem;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .home-filters::-webkit-scrollbar { display: none; }

        .home-filter-tab {
            padding: 0.6rem 1.15rem;
            border-radius: 99px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #f8fafc;
            color: #64748b;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }

        .home-filter-tab.active {
            background: black;
            color: white;
            border-color: black;
        }

        /* Settings View */
        #settings-view {
            display: none;
            position: fixed;
            inset: 0;
            background: white;
            z-index: 100;
            padding: 1.5rem;
            overflow-y: auto;
        }

        #settings-view.active { display: block; }

        .settings-header {
            max-width: 800px;
            margin: 0 auto 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-section {
            max-width: 800px;
            margin: 0 auto 2rem;
        }

        .settings-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #94a3b8;
            margin-bottom: 1rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 0.5rem;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.5rem;
        }

        .filter-pill {
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid #f1f5f9;
            text-align: left;
            transition: all 0.2s;
            background: #f8fafc;
            color: #64748b;
        }

        .filter-pill.active { background: black; color: white; border-color: black; }

        .nav-btn {
            background: var(--legal-black);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            justify-content: center;
        }

        .install-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 1.25rem;
            text-align: center;
        }

        .install-btn {
            background: #2563eb;
            color: white;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            margin-top: 1rem;
        }

        .last-updated-pill {
            text-align: right;
            font-size: 0.6rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            line-height: 1.2;
        }

        .action-btn {
            padding: 10px;
            border-radius: 10px;
            transition: all 0.2s;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border: 1px solid #f1f5f9;
        }

        .action-btn:active { background: #f1f5f9; color: #000; }

        .copy-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header class="w-full px-6 py-8 flex flex-col items-center border-b border-slate-100 bg-white relative">
        <div class="absolute right-6 top-8 last-updated-pill" id="last-updated">Syncing...</div>
        <div class="citecase-logo">
            <span class="logo-cite">Cite</span><span class="logo-case">Case</span>
        </div>
        <p class="meta-text text-slate-400 mt-2" style="font-size: 10px; tracking: 0.4em;">Legal News Hub</p>
    </header>

    <div class="app-container">
        <div class="controls-bar">
            <div class="search-container">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />

            <button onclick="toggleSettings()" class="settings-btn" title="Settings">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                </svg>
            </button>
        </div>

        <div class="home-filters">
            <button onclick="setCourtFilter('All')" class="home-filter-tab active" data-filter="All">All</button>
            <button onclick="setCourtFilter('Supreme Court')" class="home-filter-tab" data-filter="Supreme Court">Supreme Court</button>
            <button onclick="setCourtFilter('High Court')" class="home-filter-tab" data-filter="High Court">High Courts</button>
        </div>

        <main>
            <div class="mb-6 flex flex-col gap-4">
                <div id="top-nav" class="flex justify-between items-center hidden border-b border-slate-50 pb-4">
                    <button onclick="loadNextDay()" class="nav-btn py-2 px-6">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clip-rule="evenodd" /></svg>
                        Newer
                    </button>
                    <span onclick="jumpToToday()" class="text-blue-600 underline text-xs font-bold uppercase cursor-pointer">Back to Latest</span>
                </div>
                
                <div class="meta-text text-slate-400 flex justify-between items-center px-1">
                    <span id="date-label">Today's Feed</span>
                    <span><span id="feed-stats" class="text-slate-900">0</span> Briefs</span>
                </div>
            </div>

            <div id="news-feed-list"></div>

            <div id="empty-view" class="hidden py-24 text-center">
                <p id="empty-message" class="meta-text text-slate-400 italic">No news found</p>
            </div>

            <div id="archive-nav">
                <button onclick="loadPreviousDay()" id="archive-nav-btn" class="nav-btn w-full py-4 mt-8">
                    Archive: Previous Day
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- Settings Overlay -->
    <div id="settings-view">
        <div class="settings-header">
            <h2 class="text-2xl font-black tracking-tight">Settings</h2>
            <button onclick="toggleSettings()" class="settings-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>

        </div>

        <section class="settings-section">
            <h3 class="settings-title">Web App Installation</h3>
            <div id="pwa-status-box" class="install-box">

        </section>

        <section class="settings-section">

                <button onclick="setCourtFilter('Gauhati High Court')" class="filter-pill h-pill" data-court="Gauhati High Court">Gauhati</button>

            <a href="https://tally.so/r/J9pD0d" target="_blank" class="nav-btn w-full max-w-xs">Give Feedback</a>

        </section>
    </div>

    <div id="copy-toast" class="copy-toast">Link copied to clipboard</div>

    <footer class="py-12 bg-white"></footer>

    <script type="module">
        // PWA AUTO-UPDATE LOGIC
        let deferredPrompt;
        const pwaStatusBox = document.getElementById('pwa-status-box');

        function updateInstallUI() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            if (isStandalone) {
                pwaStatusBox.innerHTML = `<p class="text-sm font-bold text-emerald-600 uppercase tracking-wider">Installed</p>`;
            } else if (deferredPrompt) {
                pwaStatusBox.innerHTML = `<button id="pwa-install-trigger" class="install-btn">Install App</button>`;
                document.getElementById('pwa-install-trigger').addEventListener('click', async () => {
                    deferredPrompt.prompt();
                    await deferredPrompt.userChoice;
                    deferredPrompt = null;
                    updateInstallUI();
                });
            } else if (isIOS) {
                pwaStatusBox.innerHTML = `<p class="text-sm text-slate-500">Tap <strong>Share</strong> then <strong>'Add to Home Screen'</strong>.</p>`;
            } else {
                pwaStatusBox.innerHTML = `<p class="text-xs text-slate-400">Install via your browser's menu.</p>`;
            }
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            updateInstallUI();
        });

        // SERVICE WORKER
        const isPreviewEnv = window.location.protocol === 'blob:' || window.location.hostname.includes('usercontent.goog');
        if ('serviceWorker' in navigator && !isPreviewEnv) {
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('./sw.js').then(reg => reg.update());
            });
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });
        }

        // APP DATA LOGIC
        const DATA_URL = `https://raw.githubusercontent.com/citecase/news/main/news.json?t=${Date.now()}`;
        const newsFeedList = document.getElementById('news-feed-list');
        const lastUpdatedEl = document.getElementById('last-updated');
        const feedStats = document.getElementById('feed-stats');
        const searchInput = document.getElementById('search-input');
        const dateLabel = document.getElementById('date-label');
        const topNav = document.getElementById('top-nav');
        const archiveNav = document.getElementById('archive-nav');
        const settingsView = document.getElementById('settings-view');
        
        let newsData = [];
        let activeSources = new Set();
        let allSources = [];
        let dayOffset = 0;
        let searchQuery = '';
        let courtFilter = 'All'; 
        let currentAnchorDate = new Date(); 

        async function initApp() {
            try {
                const response = await fetch(DATA_URL);
                const raw = await response.json();
                newsData = raw.map(item => {
                    const dateStr = item.date.includes(' IST') ? item.date.replace(' IST', '+05:30') : item.date;
                    return { ...item, timestamp: new Date(dateStr) };
                }).sort((a, b) => b.timestamp - a.timestamp);

                if (newsData.length > 0) {
                    const latestDate = new Date(newsData[0].timestamp);
                    currentAnchorDate = new Date(latestDate.getFullYear(), latestDate.getMonth(), latestDate.getDate());
                    lastUpdatedEl.innerHTML = `Updated<br>${latestDate.toLocaleDateString('en-IN', {day:'2-digit', month:'short'})} ${latestDate.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'})}`;
                }

                allSources = [...new Set(newsData.map(item => item.source))].sort();
                activeSources = new Set(allSources);

                searchInput.addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase().trim(); refreshList(); });
                renderSourceFilters();
                refreshList();
                updateInstallUI();
            } catch (error) { 
                newsFeedList.innerHTML = `<div class="py-20 text-center text-slate-300 italic">Connecting to feed...</div>`; 
            }
        }

        window.systemShare = function(url, title) {
            if (navigator.share) {
                navigator.share({ title: 'CiteCase Legal News', text: title, url: url }).catch(err => { if (err.name !== 'AbortError') console.error('Share failed:', err); });
            } else {
                const el = document.createElement('textarea');
                el.value = `${title}\n\n${url}`;
                document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
                const toast = document.getElementById('copy-toast'); toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 2000);
            }
        };

        window.toggleSettings = function() { settingsView.classList.toggle('active'); updateInstallUI(); };

        window.setCourtFilter = function(filter) {
            courtFilter = filter;
            document.querySelectorAll('.home-filter-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === filter));
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.toggle('active', p.dataset.court === filter));
            if (settingsView.classList.contains('active')) settingsView.classList.remove('active');
            refreshList();
        };

        function renderSourceFilters() {
            const container = document.getElementById('source-filters');
            container.innerHTML = '';
            allSources.forEach(source => {
                const btn = document.createElement('button');
                btn.className = `filter-pill ${activeSources.has(source) ? 'active' : ''}`;
                btn.innerText = source;
                btn.onclick = () => {
                    if (activeSources.has(source)) { if (activeSources.size > 1) activeSources.delete(source); }
                    else activeSources.add(source);
                    renderSourceFilters(); refreshList();
                };
                container.appendChild(btn);
            });
        }

        window.loadPreviousDay = function() { dayOffset++; refreshList(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        window.loadNextDay = function() { if (dayOffset > 0) { dayOffset--; refreshList(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }
        window.jumpToToday = function() { dayOffset = 0; searchInput.value = ''; searchQuery = ''; refreshList(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function refreshList() {
            if (!newsFeedList) return;
            newsFeedList.innerHTML = '';
            const isSearching = searchQuery.length > 0;
            const targetDate = new Date(currentAnchorDate);
            targetDate.setDate(targetDate.getDate() - dayOffset);
            const targetDayStr = targetDate.toLocaleDateString('en-CA');

            if (isSearching) { 
                topNav.classList.add('hidden'); archiveNav.classList.add('hidden'); 
                dateLabel.innerText = "Global Search"; 
            } else { 
                archiveNav.classList.remove('hidden'); 
                if (dayOffset > 0) topNav.classList.remove('hidden'); else topNav.classList.add('hidden'); 
                dateLabel.innerText = dayOffset === 0 ? "Today's Feed" : `${targetDate.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' })} Feed`; 
            }

            let filteredData = newsData.filter(item => {
                const matchesSource = activeSources.has(item.source);
                const matchesSearch = item.title.toLowerCase().includes(searchQuery) || item.source.toLowerCase().includes(searchQuery);
                
                let matchesCourt = true;
                const lowerTitle = item.title.toLowerCase();
                const lowerSource = item.source.toLowerCase();

                if (courtFilter === 'Supreme Court') {
                    const scRegex = /\bsc\b/i;
                    const fullPhrases = ['supreme court', 'apex court', 'top court', 'constitution bench', 'caseciter'];
                    matchesCourt = fullPhrases.some(p => lowerTitle.includes(p) || lowerSource.includes(p)) || 
                                   scRegex.test(lowerTitle) || 
                                   scRegex.test(lowerSource);
                } else if (courtFilter === 'High Court') {
                    matchesCourt = lowerTitle.includes('high court') || lowerSource.includes('high court');
                } else if (courtFilter !== 'All') {
                    const lowerCourt = courtFilter.toLowerCase();
                    matchesCourt = lowerTitle.includes(lowerCourt) || lowerSource.includes(lowerCourt);
                }

                if (isSearching) return matchesSource && matchesSearch && matchesCourt;
                return item.timestamp.toLocaleDateString('en-CA') === targetDayStr && matchesSource && matchesCourt;
            });

            // CRITICAL: Custom Sort - CaseCiter items ALWAYS go to the top, others follow sorted by time
            filteredData.sort((a, b) => {
                const aIsCC = a.source === "CaseCiter";
                const bIsCC = b.source === "CaseCiter";
                if (aIsCC && !bIsCC) return -1;
                if (!aIsCC && bIsCC) return 1;
                // If both are same type (both CC or both not CC), sort by time descending
                return b.timestamp - a.timestamp;
            });

            feedStats.innerText = filteredData.length;
            if (filteredData.length === 0) { 
                newsFeedList.innerHTML = '<div class="py-24 text-center text-slate-300 italic">No legal updates found for this selection.</div>';
            } else { 
                filteredData.forEach(item => newsFeedList.appendChild(createNewsItem(item, isSearching || dayOffset > 0))); 
            }
        }

        function createNewsItem(item, showDate) {
            const article = document.createElement('article');
            article.className = 'news-item';
            const timeStr = item.timestamp.toLocaleString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
            const datePrefix = showDate ? item.timestamp.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + " • " : "";
            const titleSafe = item.title.replace(/'/g, "\\'");

            article.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <div class="flex items-center gap-2">
                        ${showDate ? '<span class="search-badge text-[0.6rem] font-bold bg-slate-100 px-2 py-0.5 rounded">ARCHIVE</span>' : ''}
                        <span class="source-tag ${item.source === "CaseCiter" ? "source-caseciter" : ""}">${item.source}</span>
                        <span class="text-[0.7rem] font-bold text-slate-400 uppercase tracking-widest">${datePrefix}${timeStr}</span>
                    </div>
                    <button onclick="systemShare('${item.link}', '${titleSafe}')" class="action-btn" title="Share">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                        </svg>
                    </button>
                </div>
                <a href="${item.link}" target="_blank" class="news-headline">${item.title}</a>
            `;
            return article;
        }

        initApp();
    </script>
</body>
</html>

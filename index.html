<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CiteCase | Legal News Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Applying Georgia globally as requested */
        :root {
            --bg-color: #ffffff;
            --legal-black: #000000;
            --accent-blue: #2563eb;
            --border-light: #f1f5f9;
            --main-font: Georgia, 'Times New Roman', Times, serif;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--main-font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--legal-black);
            -webkit-font-smoothing: antialiased;
            overflow-y: auto;
        }

        /* Branding & Logo */
        .citecase-logo {
            display: flex;
            align-items: center;
            font-family: var(--main-font);
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .logo-cite { color: var(--legal-black); padding-right: 2px; }
        .logo-case {
            background: var(--legal-black);
            color: white;
            padding: 0 10px;
            margin-left: 4px;
            border-radius: 4px;
        }

        /* Standard Single Column Layout */
        .app-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* News Items */
        .news-item {
            border-bottom: 1px solid var(--border-light);
            padding: 1.75rem 0;
            transition: opacity 0.2s ease;
        }

        .news-item:first-child { padding-top: 1rem; }

        .news-headline {
            font-family: var(--main-font);
            font-size: 1.65rem;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 0.5rem;
            display: block;
            transition: color 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .news-headline:hover { color: var(--accent-blue); }

        .source-tag {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            background: #f8fafc;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-light);
        }

        .source-caseciter { background: #000; color: #fff; border-color: #000; }

        /* Controls Area */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-container { position: relative; flex-grow: 1; min-width: 200px; }

        .search-input {
            width: 100%;
            padding: 0.65rem 1rem 0.65rem 2.6rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: var(--main-font);
            outline: none;
        }

        .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none; }

        .filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.4rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }

        .filter-menu {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.5rem;
            padding: 1.5rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            margin-top: -1rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.05);
        }

        .filter-menu.active { display: grid; }

        .source-chip {
            padding: 0.6rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid #f1f5f9;
            text-align: left;
        }

        .source-chip.active { background: black; color: white; border-color: black; }

        .nav-btn {
            background: var(--legal-black);
            color: white;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            justify-content: center;
        }

        .meta-text { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }

        .feedback-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #000;
            color: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
        }

        .action-btn {
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bookmark-btn.active { color: #2563eb; background: #eff6ff; }
        .action-btn:hover { color: #64748b; background: #f8fafc; }
        .btn-saved { background: #f1f5f9; color: #475569; }
        .btn-saved.active { background: #2563eb; color: #fff; }
        .search-badge { background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; margin-right: 8px; }
        .jump-today { font-size: 0.75rem; font-weight: 700; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; text-decoration: underline; }

        .share-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            border-radius: 12px;
            z-index: 50;
            min-width: 160px;
            padding: 0.4rem;
            margin-top: 0.5rem;
        }

        .share-menu.active { display: block; }

        .share-option {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.75rem;
            width: 100%;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .share-option:hover { background: #f8fafc; }

        .copy-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header class="w-full px-8 py-10 flex flex-col items-center border-b border-slate-100 bg-white">
        <div class="citecase-logo">
            <span class="logo-cite">Cite</span><span class="logo-case">Case</span>
        </div>
        <p class="meta-text text-slate-400 mt-2" style="font-size: 11px; tracking: 0.4em;">Legal News Hub</p>
        
        <a href="https://tally.so/r/J9pD0d" target="_blank" class="feedback-link mt-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd" />
            </svg>
            Give Feedback
        </a>
    </header>

    <div class="app-container">
        <div class="controls-bar">
            <div class="search-container">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search archives...">
            </div>
            <div class="flex gap-2">
                <button onclick="toggleFilter()" class="filter-btn">Sources</button>
                <button id="toggle-saved-btn" onclick="toggleViewMode()" class="filter-btn btn-saved">Saved</button>
            </div>
        </div>

        <div id="filter-container" class="filter-menu"></div>

        <main>
            <div class="mb-8 flex flex-col gap-4">
                <div id="top-nav" class="flex justify-between items-center hidden border-b border-slate-100 pb-5">
                    <button onclick="loadNextDay()" class="nav-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clip-rule="evenodd" /></svg>
                        Newer Updates
                    </button>
                    <span onclick="jumpToToday()" class="jump-today">Back to Today</span>
                </div>
                
                <div class="meta-text text-slate-400 flex justify-between items-center px-1">
                    <span id="date-label">Today's Feed</span>
                    <span><span id="feed-stats" class="text-slate-900">0</span> Briefs</span>
                </div>
            </div>

            <div id="news-feed-list"></div>

            <div id="empty-view" class="hidden py-24 text-center">
                <p id="empty-message" class="meta-text text-slate-400 italic">No news matches your selection</p>
            </div>

            <div id="archive-nav">
                <button onclick="loadPreviousDay()" id="archive-nav-btn" class="nav-btn w-full py-5 mt-10">
                    Archive: Previous Day
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                </button>
            </div>
        </main>
    </div>

    <div id="copy-toast" class="copy-toast">Link copied to clipboard</div>

    <footer class="mt-auto py-16 border-t border-slate-50 bg-white text-center">
        <p class="meta-text text-slate-300" style="letter-spacing: 0.3em;">CiteCase Legal News Hub • Indian Standard Time</p>
    </footer>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'citecase-legal-hub';

        const DATA_URL = "https://raw.githubusercontent.com/citecase/news/main/news.json";
        const newsFeedList = document.getElementById('news-feed-list');
        const emptyView = document.getElementById('empty-view');
        const emptyMessage = document.getElementById('empty-message');
        const filterContainer = document.getElementById('filter-container');
        const feedStats = document.getElementById('feed-stats');
        const searchInput = document.getElementById('search-input');
        const dateLabel = document.getElementById('date-label');
        const topNav = document.getElementById('top-nav');
        const archiveNav = document.getElementById('archive-nav');
        const toggleSavedBtn = document.getElementById('toggle-saved-btn');
        const copyToast = document.getElementById('copy-toast');
        
        let newsData = [];
        let activeSources = new Set();
        let allSources = [];
        let dayOffset = 0;
        let searchQuery = '';
        let viewMode = 'feed';
        let bookmarks = new Map();
        let currentUser = null;

        let currentAnchorDate = new Date(); 

        async function initApp() {
            try {
                // Initialize Auth
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => { if (user) { currentUser = user; setupBookmarkListener(); } });

                // Fetch Data
                const response = await fetch(DATA_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                const raw = await response.json();
                
                newsData = raw.map(item => {
                    const dateStr = item.date.includes(' IST') ? item.date.replace(' IST', '+05:30') : item.date;
                    return { ...item, timestamp: new Date(dateStr) };
                }).sort((a, b) => b.timestamp - a.timestamp);

                if (newsData.length > 0) {
                    const latestDate = new Date(newsData[0].timestamp);
                    currentAnchorDate = new Date(latestDate.getFullYear(), latestDate.getMonth(), latestDate.getDate());
                }

                allSources = [...new Set(newsData.map(item => item.source))].sort();
                activeSources = new Set(allSources);

                searchInput.addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase().trim(); refreshList(); });
                renderFilters();
                refreshList();
            } catch (error) { 
                console.error("Initialization failed:", error);
                newsFeedList.innerHTML = `<div class="py-20 text-center text-slate-300 italic">Unable to sync news feed. Please check your connection.</div>`; 
            }
        }

        function setupBookmarkListener() {
            if (!currentUser) return;
            const bookmarksRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'bookmarks');
            onSnapshot(bookmarksRef, (snapshot) => {
                bookmarks.clear();
                snapshot.forEach(doc => bookmarks.set(doc.id, doc.data()));
                refreshList();
            }, (error) => console.error("Snapshot error:", error));
        }

        // Helper to generate a safe ID for Firestore
        function getSafeId(str) {
            try {
                // Use a simple hash or base64-encode ASCII-only
                return btoa(unescape(encodeURIComponent(str))).replace(/[^a-zA-Z0-9]/g, '').substring(0, 120);
            } catch (e) {
                return str.substring(0, 50).replace(/[^a-zA-Z0-9]/g, '');
            }
        }

        window.toggleBookmark = async function(link) {
            if (!currentUser) return;
            const item = newsData.find(n => n.link === link);
            if (!item) return;

            const bookmarkId = getSafeId(link);
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'bookmarks', bookmarkId);

            if (bookmarks.has(bookmarkId)) {
                await deleteDoc(docRef);
            } else {
                await setDoc(docRef, {
                    ...item,
                    timestamp: item.timestamp.toISOString(),
                    bookmarkedAt: new Date().toISOString()
                });
            }
        };

        window.toggleShareMenu = function(id) {
            const menu = document.getElementById(`share-menu-${id}`);
            document.querySelectorAll('.share-menu').forEach(m => { if(m !== menu) m.classList.remove('active'); });
            if (menu) menu.classList.toggle('active');
        };

        window.shareOnPlatform = function(platform, url, title) {
            let shareUrl = '';
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);
            const textPlusUrl = encodeURIComponent(`${title}\n\n${url}`);

            switch(platform) {
                case 'x': shareUrl = `https://twitter.com/intent/tweet?text=${encodedTitle}&url=${encodedUrl}`; break;
                case 'linkedin': shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`; break;
                case 'facebook': shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`; break;
                case 'whatsapp': shareUrl = `https://wa.me/?text=${textPlusUrl}`; break;
                case 'telegram': shareUrl = `https://t.me/share/url?url=${encodedUrl}&text=${encodedTitle}`; break;
                case 'native':
                    if (navigator.share) {
                        navigator.share({ title, url }).catch((error) => {
                            if (error.name !== 'AbortError') console.error('Share failed:', error);
                        });
                        return;
                    } else {
                        const el = document.createElement('textarea'); el.value = url; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); showToast(); return;
                    }
            }
            if (shareUrl) window.open(shareUrl, '_blank', 'noopener,noreferrer');
        };

        function showToast() { copyToast.style.opacity = '1'; setTimeout(() => { copyToast.style.opacity = '0'; }, 2000); }
        document.addEventListener('click', (e) => { if (!e.target.closest('.relative')) document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('active')); });
        window.toggleViewMode = function() { viewMode = viewMode === 'feed' ? 'saved' : 'feed'; toggleSavedBtn.classList.toggle('active'); refreshList(); };
        window.toggleFilter = function() { filterContainer.classList.toggle('active'); };

        function renderFilters() {
            filterContainer.innerHTML = '';
            allSources.forEach(source => {
                const btn = document.createElement('button');
                btn.className = `source-chip ${activeSources.has(source) ? 'active' : ''}`;
                btn.innerText = source;
                btn.onclick = () => {
                    if (activeSources.has(source)) { if (activeSources.size > 1) activeSources.delete(source); }
                    else activeSources.add(source);
                    renderFilters(); refreshList();
                };
                filterContainer.appendChild(btn);
            });
        }

        window.loadPreviousDay = function() { dayOffset++; refreshList(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        window.loadNextDay = function() { if (dayOffset > 0) { dayOffset--; refreshList(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }
        window.jumpToToday = function() { dayOffset = 0; searchInput.value = ''; searchQuery = ''; refreshList(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function refreshList() {
            if (!newsFeedList) return;
            newsFeedList.innerHTML = '';
            const isSearching = searchQuery.length > 0;
            
            const targetDate = new Date(currentAnchorDate);
            targetDate.setDate(targetDate.getDate() - dayOffset);
            
            // Format target date as string for robust comparison
            const targetDayStr = targetDate.toLocaleDateString('en-CA'); // YYYY-MM-DD format

            if (viewMode === 'saved') { 
                topNav.classList.add('hidden'); archiveNav.classList.add('hidden'); 
                dateLabel.innerText = "Your Saved Briefs"; 
            } else if (isSearching) { 
                topNav.classList.add('hidden'); archiveNav.classList.add('hidden'); 
                dateLabel.innerText = "Global Archive Results"; 
            } else { 
                archiveNav.classList.remove('hidden'); 
                if (dayOffset > 0) topNav.classList.remove('hidden'); else topNav.classList.add('hidden'); 
                dateLabel.innerText = dayOffset === 0 ? "Latest Updates" : `${targetDate.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })} Feed`; 
            }

            const filteredData = newsData.filter(item => {
                const matchesSource = activeSources.has(item.source);
                const matchesSearch = item.title.toLowerCase().includes(searchQuery) || item.source.toLowerCase().includes(searchQuery);
                const bookmarkId = getSafeId(item.link);

                if (viewMode === 'saved') {
                    return bookmarks.has(bookmarkId) && matchesSource && (isSearching ? matchesSearch : true);
                }
                if (isSearching) return matchesSource && matchesSearch;

                // robust day comparison
                const itemDayStr = item.timestamp.toLocaleDateString('en-CA');
                return itemDayStr === targetDayStr && matchesSource;
            });

            feedStats.innerText = filteredData.length;
            if (filteredData.length === 0) { 
                emptyView.classList.remove('hidden'); 
                emptyMessage.innerText = viewMode === 'saved' ? "No saved briefs found." : "No news briefs found for this date."; 
            } else { 
                emptyView.classList.add('hidden'); 
                filteredData.forEach(item => newsFeedList.appendChild(createNewsItem(item, isSearching || viewMode === 'saved' || dayOffset > 0))); 
            }
        }

        function createNewsItem(item, showDate) {
            const article = document.createElement('article');
            article.className = 'news-item';
            const timeStr = item.timestamp.toLocaleString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
            const datePrefix = showDate ? item.timestamp.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + " • " : "";
            const bookmarkId = getSafeId(item.link);
            const titleSafe = item.title.replace(/'/g, "\\'");

            article.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <div class="flex items-center gap-2">
                        ${showDate ? '<span class="search-badge">ARCHIVE</span>' : ''}
                        <span class="source-tag ${item.source === "CaseCiter" ? "source-caseciter" : ""}">${item.source}</span>
                        <span class="text-[0.75rem] font-bold text-slate-400 uppercase tracking-widest">${datePrefix}${timeStr} IST</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <div class="relative">
                            <button onclick="toggleShareMenu('${bookmarkId}')" class="action-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
                            </button>
                            <div id="share-menu-${bookmarkId}" class="share-menu">
                                <button onclick="shareOnPlatform('whatsapp', '${item.link}', '${titleSafe}')" class="share-option">WhatsApp</button>
                                <button onclick="shareOnPlatform('telegram', '${item.link}', '${titleSafe}')" class="share-option">Telegram</button>
                                <button onclick="shareOnPlatform('x', '${item.link}', '${titleSafe}')" class="share-option">X (Twitter)</button>
                                <button onclick="shareOnPlatform('linkedin', '${item.link}', '${titleSafe}')" class="share-option">LinkedIn</button>
                                <button onclick="shareOnPlatform('native', '${item.link}', '${titleSafe}')" class="share-option border-t border-slate-50 mt-1">System Share</button>
                            </div>
                        </div>
                        <button onclick="toggleBookmark('${item.link}')" class="bookmark-btn action-btn ${bookmarks.has(bookmarkId) ? 'active' : ''}">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" /></svg>
                        </button>
                    </div>
                </div>
                <a href="${item.link}" target="_blank" class="news-headline">${item.title}</a>
            `;
            return article;
        }

        initApp();
    </script>
</body>
</html>

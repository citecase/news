<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CiteCase | Legal News Hub</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CiteCase">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --legal-black: #000000;
            --accent-blue: #2563eb;
            --border-light: #f1f5f9;
            --main-font: Georgia, 'Times New Roman', Times, serif;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--main-font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--legal-black);
            -webkit-font-smoothing: antialiased;
            overflow-y: auto;
        }

        .citecase-logo {
            display: flex;
            align-items: center;
            font-family: var(--main-font);
            font-weight: 900;
            font-size: 2rem;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .logo-cite { color: var(--legal-black); padding-right: 2px; }
        .logo-case {
            background: var(--legal-black);
            color: white;
            padding: 0 8px;
            margin-left: 4px;
            border-radius: 4px;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .news-item {
            border-bottom: 1px solid var(--border-light);
            padding: 1.75rem 0;
            transition: opacity 0.2s ease;
        }

        .news-item:first-child { padding-top: 1rem; }

        .news-headline {
            font-family: var(--main-font);
            font-size: 1.65rem;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 0.5rem;
            display: block;
            transition: color 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .news-headline:hover { color: var(--accent-blue); }

        .source-tag {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            background: #f8fafc;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-light);
        }

        .source-caseciter { background: #000; color: #fff; border-color: #000; }

        .controls-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .search-container { position: relative; flex-grow: 1; }

        .search-input {
            width: 100%;
            padding: 0.65rem 1rem 0.65rem 2.6rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: var(--main-font);
            outline: none;
        }

        .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none; }

        .settings-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #64748b;
        }

        .settings-btn:hover { background: #f1f5f9; color: #000; border-color: #cbd5e1; }

        .home-filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 1.5rem;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .home-filters::-webkit-scrollbar { display: none; }

        .home-filter-tab {
            padding: 0.6rem 1.25rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #f8fafc;
            color: #64748b;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }

        .home-filter-tab.active {
            background: black;
            color: white;
            border-color: black;
        }

        /* Settings View */
        #settings-view {
            display: none;
            position: fixed;
            inset: 0;
            background: white;
            z-index: 100;
            padding: 2rem;
            overflow-y: auto;
        }

        #settings-view.active { display: block; }

        .settings-header {
            max-width: 800px;
            margin: 0 auto 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-section {
            max-width: 800px;
            margin: 0 auto 2.5rem;
        }

        .settings-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #94a3b8;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 0.5rem;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
        }

        .filter-pill {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #f1f5f9;
            text-align: left;
            transition: all 0.2s;
            background: #f8fafc;
            color: #64748b;
        }

        .filter-pill.active {
            background: black;
            color: white;
            border-color: black;
        }

        .nav-btn {
            background: var(--legal-black);
            color: white;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            justify-content: center;
        }

        /* PWA Install Styles */
        .install-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }

        .install-btn {
            background: #2563eb;
            color: white;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            margin-top: 1rem;
            transition: transform 0.2s;
        }
        .install-btn:active { transform: scale(0.98); }

        .ios-tip {
            font-size: 0.85rem;
            color: #64748b;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
        }

        .action-btn {
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bookmark-btn.active { color: #2563eb; background: #eff6ff; }
        .action-btn:hover { color: #64748b; background: #f8fafc; }

        .share-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            border-radius: 12px;
            z-index: 50;
            min-width: 160px;
            padding: 0.4rem;
            margin-top: 0.5rem;
        }

        .share-menu.active { display: block; }

        .share-option {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.75rem;
            width: 100%;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .share-option:hover { background: #f8fafc; }

        .copy-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .last-updated-pill {
            text-align: right;
            font-size: 0.65rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

        <main>

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- Settings Overlay -->
    <div id="settings-view">
        <div class="settings-header">
            <h2 class="text-2xl font-black tracking-tight">Settings</h2>
            <button onclick="toggleSettings()" class="settings-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">

        <!-- Dedicated Web App Installation Section -->

    <div id="copy-toast" class="copy-toast">Link copied to clipboard</div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // --- PWA INSTALLATION LOGIC ---
        let deferredPrompt;
        const pwaStatusBox = document.getElementById('pwa-status-box');

        function updateInstallUI() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            if (isStandalone) {
                pwaStatusBox.innerHTML = `<p class="text-sm font-bold text-emerald-600 uppercase tracking-wider">CiteCase is already installed</p>`;
            } else if (deferredPrompt) {
                pwaStatusBox.innerHTML = `
                    <p class="text-sm text-slate-500 mb-4">Install CiteCase for faster access and a better reading experience.</p>
                    <button id="pwa-install-trigger" class="install-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                        Install Now
                    </button>
                `;
                document.getElementById('pwa-install-trigger').addEventListener('click', async () => {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        deferredPrompt = null;
                        updateInstallUI();
                    }
                });
            } else if (isIOS) {
                pwaStatusBox.innerHTML = `
                    <div class="ios-tip">
                        <p class="font-bold text-slate-700">To Install on iOS:</p>
                        <p>1. Tap the <span class="font-bold text-blue-600">Share</span> icon below.</p>
                        <p>2. Select <span class="font-bold text-slate-900">"Add to Home Screen"</span>.</p>
                    </div>
                `;
            } else {
                pwaStatusBox.innerHTML = `<p class="text-xs text-slate-400">Installation is available via your browser's menu (⋮ or ≡).</p>`;
            }
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            updateInstallUI();
        });

        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            updateInstallUI();
        });

        updateInstallUI();

        // --- SERVICE WORKER ---
        const isPreviewEnv = window.location.protocol === 'blob:' || window.location.hostname.includes('usercontent.goog');
        if ('serviceWorker' in navigator && !isPreviewEnv) {
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    if (err.name !== 'SecurityError' && err.name !== 'AbortError') console.error('SW Error:', err);
                });
            });
        }

        // --- APP LOGIC ---
        const configRaw = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'citecase-legal-hub';
        let db = null; let auth = null; let currentUser = null;

        if (configRaw) {
            try {
                const firebaseConfig = JSON.parse(configRaw);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app); db = getFirestore(app);
            } catch (e) { console.warn("Firebase inactive."); }
        }

        const DATA_URL = "https://raw.githubusercontent.com/citecase/news/main/news.json";
        const newsFeedList = document.getElementById('news-feed-list');
        const lastUpdatedEl = document.getElementById('last-updated');
        const emptyView = document.getElementById('empty-view');
        const emptyMessage = document.getElementById('empty-message');
        const feedStats = document.getElementById('feed-stats');
        const searchInput = document.getElementById('search-input');
        const dateLabel = document.getElementById('date-label');
        const topNav = document.getElementById('top-nav');
        const archiveNav = document.getElementById('archive-nav');
        const settingsView = document.getElementById('settings-view');
        
        let newsData = [];
        let activeSources = new Set();
        let allSources = [];
        let dayOffset = 0;
        let searchQuery = '';
        let courtFilter = 'All'; 
        let bookmarks = new Map();
        let currentAnchorDate = new Date(); 

        async function initApp() {
            if (auth) {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => { if (user) { currentUser = user; setupBookmarkListener(); } });
            }

            try {
                const response = await fetch(DATA_URL);
                const raw = await response.json();
                newsData = raw.map(item => {
                    const dateStr = item.date.includes(' IST') ? item.date.replace(' IST', '+05:30') : item.date;
                    return { ...item, timestamp: new Date(dateStr) };
                }).sort((a, b) => b.timestamp - a.timestamp);

                if (newsData.length > 0) {
                    const latest = newsData[0];
                    const latestDate = new Date(latest.timestamp);
                    currentAnchorDate = new Date(latestDate.getFullYear(), latestDate.getMonth(), latestDate.getDate());
                    lastUpdatedEl.innerHTML = `Last Updated<br>${latestDate.toLocaleDateString('en-IN', {day:'2-digit', month:'short'})} ${latestDate.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'})}`;
                }

                allSources = [...new Set(newsData.map(item => item.source))].sort();
                activeSources = new Set(allSources);

                searchInput.addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase().trim(); refreshList(); });
                renderSourceFilters();
                refreshList();
            } catch (error) { 
                newsFeedList.innerHTML = `<div class="py-20 text-center text-slate-300 italic">Syncing with hub...</div>`; 
            }
        }

        function setupBookmarkListener() {
            if (!currentUser || !db) return;
            const bookmarksRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'bookmarks');
            onSnapshot(bookmarksRef, (snapshot) => {
                bookmarks.clear();
                snapshot.forEach(doc => bookmarks.set(doc.id, doc.data()));
                refreshList();
            });
        }

        function getSafeId(str) {
            try { return btoa(unescape(encodeURIComponent(str))).replace(/[^a-zA-Z0-9]/g, '').substring(0, 120); }
            catch (e) { return str.substring(0, 50).replace(/[^a-zA-Z0-9]/g, ''); }
        }

        window.toggleBookmark = async function(link) {
            const bookmarkId = getSafeId(link);
            if (!db || !currentUser) {
                if (bookmarks.has(bookmarkId)) bookmarks.delete(bookmarkId);
                else {
                    const item = newsData.find(n => n.link === link);
                    bookmarks.set(bookmarkId, { ...item, timestamp: item.timestamp.toISOString() });
                }
                refreshList(); return;
            }
            const item = newsData.find(n => n.link === link);
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'bookmarks', bookmarkId);
            if (bookmarks.has(bookmarkId)) await deleteDoc(docRef);
            else await setDoc(docRef, { ...item, timestamp: item.timestamp.toISOString(), bookmarkedAt: new Date().toISOString() });
        };

        window.toggleSettings = function() { 
            settingsView.classList.toggle('active'); 
            updateInstallUI();
        };

        window.setCourtFilter = function(filter) {
            courtFilter = filter;
            document.querySelectorAll('.home-filter-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === filter));
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.toggle('active', p.dataset.court === filter));
            if (settingsView.classList.contains('active')) settingsView.classList.remove('active');
            refreshList();
        };

        function renderSourceFilters() {
            const container = document.getElementById('source-filters');
            container.innerHTML = '';
            allSources.forEach(source => {
                const btn = document.createElement('button');
                btn.className = `filter-pill ${activeSources.has(source) ? 'active' : ''}`;
                btn.innerText = source;
                btn.onclick = () => {
                    if (activeSources.has(source)) { if (activeSources.size > 1) activeSources.delete(source); }
                    else activeSources.add(source);
                    renderSourceFilters(); refreshList();
                };
                container.appendChild(btn);
            });
        }

        window.loadPreviousDay = function() { dayOffset++; refreshList(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        window.loadNextDay = function() { if (dayOffset > 0) { dayOffset--; refreshList(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }
        window.jumpToToday = function() { dayOffset = 0; searchInput.value = ''; searchQuery = ''; refreshList(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function refreshList() {
            if (!newsFeedList) return;
            newsFeedList.innerHTML = '';
            const isSearching = searchQuery.length > 0;
            const targetDate = new Date(currentAnchorDate);
            targetDate.setDate(targetDate.getDate() - dayOffset);
            const targetDayStr = targetDate.toLocaleDateString('en-CA');

            if (isSearching) { 
                topNav.classList.add('hidden'); archiveNav.classList.add('hidden'); 
                dateLabel.innerText = "Global Archives"; 
            } else { 
                archiveNav.classList.remove('hidden'); 
                if (dayOffset > 0) topNav.classList.remove('hidden'); else topNav.classList.add('hidden'); 
                dateLabel.innerText = dayOffset === 0 ? "Latest Feed" : `${targetDate.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' })} Feed`; 
            }

            const filteredData = newsData.filter(item => {
                const matchesSource = activeSources.has(item.source);
                const matchesSearch = item.title.toLowerCase().includes(searchQuery) || item.source.toLowerCase().includes(searchQuery);
                
                let matchesCourt = true;
                const lowerTitle = item.title.toLowerCase();
                const lowerSource = item.source.toLowerCase();

                if (courtFilter === 'Supreme Court') {
                    const scKeywords = ['supreme court', 'sc', 'apex court'];
                    matchesCourt = scKeywords.some(key => lowerTitle.includes(key) || lowerSource.includes(key));
                } else if (courtFilter === 'High Court') {
                    matchesCourt = lowerTitle.includes('high court') || lowerSource.includes('high court');
                } else if (courtFilter !== 'All') {
                    const lowerCourt = courtFilter.toLowerCase();
                    matchesCourt = lowerTitle.includes(lowerCourt) || lowerSource.includes(lowerCourt);
                }

                if (isSearching) return matchesSource && matchesSearch && matchesCourt;
                return item.timestamp.toLocaleDateString('en-CA') === targetDayStr && matchesSource && matchesCourt;
            });

            feedStats.innerText = filteredData.length;
            if (filteredData.length === 0) { 
                emptyView.classList.remove('hidden'); 
                emptyMessage.innerText = "No legal updates found for this selection."; 
            } else { 
                emptyView.classList.add('hidden'); 
                filteredData.forEach(item => newsFeedList.appendChild(createNewsItem(item, isSearching || dayOffset > 0))); 
            }
        }

        function createNewsItem(item, showDate) {
            const article = document.createElement('article');
            article.className = 'news-item';
            const timeStr = item.timestamp.toLocaleString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
            const datePrefix = showDate ? item.timestamp.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + " • " : "";
            const bookmarkId = getSafeId(item.link);
            const titleSafe = item.title.replace(/'/g, "\\'");

            article.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <div class="flex items-center gap-2">
                        ${showDate ? '<span class="search-badge">ARCHIVE</span>' : ''}
                        <span class="source-tag ${item.source === "CaseCiter" ? "source-caseciter" : ""}">${item.source}</span>
                        <span class="text-[0.75rem] font-bold text-slate-400 uppercase tracking-widest">${datePrefix}${timeStr} IST</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <div class="relative">
                            <button onclick="toggleShareMenu('${bookmarkId}')" class="action-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
                            </button>
                            <div id="share-menu-${bookmarkId}" class="share-menu">
                                <button onclick="shareOnPlatform('whatsapp', '${item.link}', '${titleSafe}')" class="share-option">WhatsApp</button>
                                <button onclick="shareOnPlatform('telegram', '${item.link}', '${titleSafe}')" class="share-option">Telegram</button>
                                <button onclick="shareOnPlatform('x', '${item.link}', '${titleSafe}')" class="share-option">X</button>
                                <button onclick="shareOnPlatform('linkedin', '${item.link}', '${titleSafe}')" class="share-option">LinkedIn</button>
                            </div>
                        </div>
                        <button onclick="toggleBookmark('${item.link}')" class="bookmark-btn action-btn ${bookmarks.has(bookmarkId) ? 'active' : ''}">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" /></svg>
                        </button>
                    </div>
                </div>
                <a href="${item.link}" target="_blank" class="news-headline">${item.title}</a>
            `;
            return article;
        }

        window.toggleShareMenu = function(id) {
            const menu = document.getElementById(`share-menu-${id}`);
            document.querySelectorAll('.share-menu').forEach(m => { if(m !== menu) m.classList.remove('active'); });
            if (menu) menu.classList.toggle('active');
        };

        window.shareOnPlatform = function(platform, url, title) {
            let shareUrl = '';
            const textPlusUrl = encodeURIComponent(`${title}\n\n${url}`);
            const encodedUrl = encodeURIComponent(url);
            const encodedTitle = encodeURIComponent(title);

            switch(platform) {
                case 'whatsapp': shareUrl = `https://wa.me/?text=${textPlusUrl}`; break;
                case 'telegram': shareUrl = `https://t.me/share/url?url=${encodedUrl}&text=${encodedTitle}`; break;
                case 'x': shareUrl = `https://twitter.com/intent/tweet?text=${encodedTitle}&url=${encodedUrl}`; break;
                case 'linkedin': shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`; break;
            }
            if (shareUrl) window.open(shareUrl, '_blank');
        };

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.relative') && !e.target.closest('.action-btn')) {
                document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('active'));
            }
        });

        initApp();
    </script>
</body>
</html>

name: Update Verdictum News

on:
  schedule:
    - cron: "0 */6 * * *" # Line 3: Quotes are mandatory here to avoid syntax errors
  workflow_dispatch:      # Allows you to click 'Run' manually for testing

jobs:
  update-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Gives the bot permission to save the file back to your repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser

      - name: Run update script
        run: python update_verdictum.py

      - name: Commit and push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add verdictum.md
          git commit -m "Update verdictum.md with latest stories" || echo "No changes"
          git push

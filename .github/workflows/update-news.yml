name: Update News Archive

on:
  schedule:
    # Runs every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    # Allows you to manually trigger it from the Actions tab

jobs:
  run-update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install feedparser requests

      - name: Fetch and Append News
        run: python update_verdictum.py

      - name: Commit and Push New Stories
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add verdictum.md news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated news update (30-min interval)" && git push)

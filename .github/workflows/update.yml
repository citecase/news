name: Legal Question Generator

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:      # Allows you to run it manually from the "Actions" tab

permissions:
  contents: write         # Crucial for allowing the bot to push changes to your repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4 # Updated to v4 for 2026 compatibility

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade google-generativeai feedparser requests

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python app.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add last_seen.txt questions_of_law.md
          # The '|| exit 0' prevents the action from failing if there are no new posts to commit
          git commit -m "Update Questions of Law from CaseCiter [automated]" || exit 0
          git push
